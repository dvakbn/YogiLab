plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yogilab.sadhanapada'
    compileSdk 35

    defaultConfig {
        applicationId 'com.yogilab.sadhanapada'
        minSdk 23
        targetSdk 35
        versionCode 14
        versionName '1.4'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
