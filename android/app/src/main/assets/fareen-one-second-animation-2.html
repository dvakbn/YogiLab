<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YogiLab — Building a Version of Myself</title>
<style>
:root{color-scheme:light;--bg:#f1f4ef;--text:#18211a;--g1:#6f806f;--g1-rgb:111,128,111;--ink-rgb:24,33,26;--sun-rgb:236,200,132;--win-a:.66;--win-b:.38;--sun-a:.9;--halo-a:.26;--ring:.13;--b:1;--font-display:"Bodoni 72","Didot","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
@media (prefers-color-scheme:dark){:root:not([data-t="light"]){color-scheme:dark;--bg:#101411;--text:#eef1ea;--g1:#a8b7a4;--g1-rgb:168,183,164;--ink-rgb:0,0,0;--win-a:.34;--win-b:.12;--sun-a:.55;--halo-a:.22;--ring:.1;--b:.94}}
:root[data-t="dark"]{color-scheme:dark;--bg:#101411;--text:#eef1ea;--g1:#a8b7a4;--g1-rgb:168,183,164;--ink-rgb:0,0,0;--win-a:.34;--win-b:.12;--sun-a:.55;--halo-a:.22;--ring:.1;--b:.94}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#intro{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:var(--bg);color:var(--text);animation:introOut .26s cubic-bezier(.4,0,.2,1) 1.08s forwards;transition:background-color .35s ease,color .35s ease}

/* A doorway of first light. --w = window width; every size scales from it. */
#intro .introVisual{--w:min(58vw,232px,30vh);--g:calc(var(--w)*.06);position:relative;z-index:1;flex:0 0 auto;width:calc(var(--w) + var(--g)*2);height:calc(var(--w)*1.12 + var(--g)*2);margin-top:calc(var(--w)*.2)}

/* warm light spilling out around her */
#intro .introVisual::before{content:"";position:absolute;z-index:0;width:calc(var(--w)*2);height:calc(var(--w)*2);left:50%;top:calc(var(--w)*-.82);margin-left:calc(var(--w)*-1);background:radial-gradient(closest-side,rgba(var(--sun-rgb),var(--halo-a)),transparent);pointer-events:none;animation:fade .7s ease .15s both}

/* ripples: concentric with the arch, the 4th ring is the frame itself */
#intro .introRings{position:absolute;z-index:0;display:block;width:calc(var(--w)*5);height:calc(var(--w)*5);left:50%;top:calc(var(--w)*.5 + var(--g));margin:calc(var(--w)*-2.5) 0 0 calc(var(--w)*-2.5);pointer-events:none;
  background:repeating-radial-gradient(circle,transparent 0 calc(var(--w)*.14 - 1px),rgba(var(--g1-rgb),var(--ring)) calc(var(--w)*.14 - 1px) calc(var(--w)*.14));
  -webkit-mask-image:radial-gradient(closest-side,#000 18%,transparent 62%);mask-image:radial-gradient(closest-side,#000 18%,transparent 62%);
  animation:ripple .9s cubic-bezier(.22,1,.36,1) both}

/* the arch draws itself */
#intro .introArc{position:absolute;z-index:2;inset:0;width:100%;height:100%;fill:none;stroke:rgba(var(--g1-rgb),.62);stroke-width:.5;stroke-linejoin:round}
#intro .introArc path{stroke-dasharray:380;animation:draw .62s cubic-bezier(.65,0,.25,1) both}

/* the window: sage sky, with the sun rising behind her head */
#intro .introWin{position:absolute;z-index:1;display:block;inset:var(--g);overflow:hidden;border-radius:999px 999px 2px 2px;background:linear-gradient(180deg,rgba(var(--g1-rgb),var(--win-a)),rgba(var(--g1-rgb),var(--win-b)));animation:wipe .5s cubic-bezier(.22,1,.36,1) .05s both}
#intro .introWin::before{content:"";position:absolute;left:0;right:0;top:-30%;aspect-ratio:1;border-radius:50%;background:radial-gradient(closest-side,rgba(var(--sun-rgb),var(--sun-a)),rgba(var(--sun-rgb),calc(var(--sun-a)*.4)) 45%,transparent);animation:sunrise .72s cubic-bezier(.22,1,.36,1) .12s both}

/* portrait: bottom cropped by the window, sides held by its walls, head free above so it steps out of the frame */
#intro .introPhoto{position:absolute;z-index:3;display:block;left:50%;bottom:calc(var(--g) - var(--w)*.14);width:calc(var(--w)*1.22);height:auto;margin-left:calc(var(--w)*-.61);border:0;background:transparent;user-select:none;-webkit-user-drag:none;pointer-events:none;transform-origin:50% 91%;
  clip-path:polygon(-60% -14%,160% -14%,160% 58%,90.98% 58%,90.98% 91.4%,9.02% 91.4%,9.02% 58%,-60% 58%);
  filter:blur(0) saturate(1) brightness(var(--b)) drop-shadow(0 0 18px rgba(var(--sun-rgb),.3)) drop-shadow(0 8px 12px rgba(var(--ink-rgb),.2));
  animation:pop .56s cubic-bezier(.2,1.25,.32,1) .16s both}

/* phrase: two italic lines whose letters tighten into place */
#intro .introCaption{position:relative;z-index:3;flex:0 0 auto;margin:36px 0 4vh;padding:0 22px;display:flex;flex-direction:column;align-items:center;text-align:center;white-space:nowrap;color:var(--text);font:italic 400 clamp(26px,7.6vw,32px)/1.14 var(--font-display)}
#intro .introCaption span{display:block;animation:rise .42s cubic-bezier(.22,.61,.36,1) .4s both}
#intro .introCaption span+span{animation-delay:.48s}

@keyframes ripple{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:380}}
@keyframes wipe{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes sunrise{from{opacity:0;transform:translateY(45%)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.88);filter:blur(9px) saturate(.2) brightness(var(--b)) drop-shadow(0 0 18px rgba(var(--sun-rgb),0)) drop-shadow(0 8px 12px rgba(var(--ink-rgb),0))}to{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;letter-spacing:.16em;transform:translateY(5px)}to{opacity:1;letter-spacing:-.005em;transform:none}}
@keyframes introOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#intro *,#intro *::before,#intro *::after{animation-duration:.01ms!important;animation-delay:0s!important}}
</style>
</head>
